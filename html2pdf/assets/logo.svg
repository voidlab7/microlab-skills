<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="doc"><rect x="292" y="212" width="440" height="600" rx="52"/></clipPath>
  </defs>

  <!-- app-icon tile, no border ring -->
  <rect width="1024" height="1024" rx="230" fill="#fafaf8"/>

  <g transform="translate(512 512) scale(1.17) translate(-512 -512)">
    <!-- single merged document with vertical conversion flow -->
    <rect x="292" y="212" width="440" height="600" rx="52" fill="#ffffff" stroke="#1d1c1a" stroke-width="26"/>
    <g clip-path="url(#doc)">
      <rect x="292" y="212" width="440" height="120" fill="#1d1c1a"/>
    </g>
    <text x="512" y="308" font-family="JetBrains Mono, Menlo, monospace" font-size="88" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>

    <!-- waterfall content lines -->
    <g stroke-linecap="round">
      <line x1="352" y1="396" x2="672" y2="396" stroke="#1d1c1a" stroke-width="18"/>
      <line x1="352" y1="452" x2="592" y2="452" stroke="#8a8a84" stroke-width="18"/>
      <line x1="352" y1="508" x2="652" y2="508" stroke="#d9d9d4" stroke-width="18"/>
      <line x1="352" y1="564" x2="532" y2="564" stroke="#d9d9d4" stroke-width="18"/>
    </g>

    <!-- compact red down-arrow -->
    <path d="M 478 610 H 546 V 654 H 582 L 512 720 L 442 654 H 478 Z"
          fill="#e5412d" stroke="#e5412d" stroke-width="12" stroke-linejoin="round"/>

    <!-- slim PDF badge -->
    <rect x="362" y="742" width="300" height="84" rx="20" fill="#e5412d"/>
    <text x="512" y="802" font-family="Archivo, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">PDF</text>
  </g>
</svg>
